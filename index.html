<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Héros du Jour</title>
  <meta name="description" content="Devine chaque jour le personnage de fiction mystère.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="entete">
    <h1 class="titre">Héros du Jour</h1>
    <p class="numero-du-jour" id="numero-du-jour"></p>
    <p class="date-du-jour" id="date-du-jour"></p>
  </header>

  <main class="contenu">
    <!-- La case de saisie et sa liste de suggestions -->
    <div class="zone-saisie">
      <label for="saisie" class="invisible">Nom du personnage</label>
      <input type="text" id="saisie" class="saisie" placeholder="Tape un nom de personnage…"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </div>

    <!-- Le compteur d'essais, et le bouton pour revoir le résultat quand la partie est finie -->
    <p id="compteur-essais" class="compteur-essais" aria-live="polite"></p>
    <button type="button" id="bouton-resultat" class="bouton" hidden>Revoir le résultat</button>

    <!-- Les indices qui s'ajoutent au fil des essais ratés -->
    <details id="indices" class="indices" open hidden>
      <summary id="indices-titre" class="indices-titre">Indices</summary>
      <ul id="liste-indices" class="liste-indices" aria-live="polite"></ul>
    </details>

    <!-- La grille : les en-têtes des 7 critères, puis une ligne de cases par essai -->
    <section class="grille" aria-label="Tes essais">
      <div id="entetes" class="entetes"></div>
      <ol id="liste-essais" class="liste-essais"></ol>
    </section>

    <p id="mode-test" class="mode-test" hidden>Mode test</p>
  </main>

  <!-- La fenêtre de fin de partie (victoire ou défaite), par-dessus le jeu -->
  <div id="fenetre-fin" class="fenetre-fond" hidden>
    <div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="fin-titre">
      <h2 id="fin-titre" class="fin-titre"></h2>
      <p id="fin-intro" class="fin-intro"></p>
      <p id="fin-nom" class="fin-nom"></p>
      <p id="fin-oeuvre" class="fin-oeuvre"></p>
      <p id="fin-fiche" class="fin-fiche"></p>
      <button type="button" id="fin-fermer" class="bouton">Fermer</button>
    </div>
  </div>

  <script src="data/constantes.js"></script>
  <script src="data/personnages.js"></script>
  <script src="data/calendrier.js"></script>
  <script src="js/outils.js"></script>
  <script src="js/jeu.js"></script>
  <script src="js/affichage.js"></script>
</body>
</html>
